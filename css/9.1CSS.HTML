<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>9.1CSS</title>
    <meta charset="UTF-8">
    <!--
selectors
=>its style rule
=>its block, block is group of properties
=>used to defined styles for elements/tags
=>we can define ethier internal or external 
Syn:
	selector{
	  property:value;
	  property:value;
	  ......
	}

types:
	  *			   #	.		  :				::
  universal, tag, id, class, pesudo classes, pseduo elements ...
  

universal selector
=>used to define/to apply common styles for all elements
Syn:
	*{
		prop:val;
		......
	}
-->
    <style>
        *{
            margin: 10px;
            padding: 10px;
            color: blue;
            background-color: lightgray;
            font: size 40px;
            text-align: center;
            border: 2px solid black;


        }
        /* selector:tag 
        -used to defined/toapply same styles for allinstanses of spesificelement(tag)
        -element selecter
           syn: tag-name{
                prop:val;
                ......}*/


        div{  
            color: green;
            background-color:yellow;
        }
    </style>
</head>
<body>
    <h1>CSS</h1>
    <p>This is a paragraph styled with CSS.</p>
