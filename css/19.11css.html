<!DOCTYPE html>
<html lang="en">
  <head>
    <title>CSS</title>
	<meta charset="UTF-8"/>
	<style>
	  img{
	    width:200px;
		height:200px;
		/*transition:600ms;*/
		transition:border-radius 600ms,box-shadow 300ms;
	  }
	  img:hover{
	    border-radius:50%;
		box-shadow:0 0 20px red;
	  }
	</style>
  </head>
  <body>
	<h2>demo on transition</h2>
	<img src="images/baby.jpg">
	
	<hr>
	<h2>demo on CSS Animations</h2>
	</style>
 </head>
 <body>
    <h2>CSS Animations Demo</h2>
    <div class="pulse" style="width:100px;height:100px;background-color:red;margin-bottom:20px;"></div>
    <div class="load" style="margin-bottom:20px;"></div>
    <div class="bounce" style="width:100px;height:100px;background-color:green;margin-bottom:20px;"></div>
    <div class="swing" style="width:100px;height:100px;background-color:orange;"></div>
 </body>
  </body>
</html>
