<!-- html & js implementations -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
	<style>
	  h2{ display:inline; }
	  input:div(2){ text-align:center; }
	</style>
  </head>
  <body>
	<div align="center">
	  <h2>Arithmatic Calc</h2> <br>
	  <input type="number" id="fn" placeholder="First number"> <br>
	  <input type="number" id="sn" placeholder="Second number"> <br>
	  <input type="text" id="res" placeholder="Result" readonly> <br>
	  <button onclick="res.value=+fn.value + +sn.value">+</button>
	  <button onclick="res.value=fn.value-sn.value">-</button>  
	  <button onclick="res.value=fn.value*sn.value">*</button>
	  <button onclick="res.value=fn.value/sn.value">/</button>	  
	  <button onclick="res.value=fn.value%sn.value">%</button>	  
	  <button onclick="res.value=fn.value**sn.value">^</button>	  
	</div>
	<div align="center">
	  <h2>Temperature convertor</h2> <br>
	  <input type="number" id="dc" placeholder="Degree Celsius" oninput="fr.value=dc.value*9/5+32">
	  <h2>=</h2>
	  <input type="number" id="fr" placeholder="Fahrenheit" oninput="dc.value=(fr.value-32)*5/9">
	</div>
	<hr>

	<div align="center">
	  <h2>Speed convertor</h2> <br>
	  <input type="number" id="km" placeholder="Kilo Meters" oninput="mi.value=km.value/1.6">
	  <h2>=</h2>
	  <input type="number" id="mi" placeholder="Miles" oninput="km.value=mi.value*1.6">
	</div>
	<hr>
